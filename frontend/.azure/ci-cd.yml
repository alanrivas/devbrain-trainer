trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  nodeVersion: '20.x'
  buildConfiguration: 'Release'

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: $(nodeVersion)
    displayName: 'Install Node.js'

  - script: |
      npm ci
    displayName: 'Install dependencies'

  - script: |
      npm run build
    displayName: 'Build Next.js'

  - script: |
      npm run export 2>/dev/null || echo "Export not configured, using build output"
    displayName: 'Export static (if configured)'
    continueOnError: true

  - task: PublishBuildArtifacts@1
    inputs:
      pathToPublish: '.next'
      artifactName: 'next-build'
      publishLocation: 'Container'
    displayName: 'Publish build artifacts'

  - task: AzureWebApp@1
    inputs:
      azureSubscription: 'Azure'
      appType: 'webAppLinux'
      appName: 'devbrain-frontend'
      runtimeStack: 'NODE|20.x'
      package: '$(System.DefaultWorkingDirectory)'
    displayName: 'Deploy to Azure App Service'
